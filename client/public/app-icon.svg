<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#040405"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.1"/>
    </linearGradient>

    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="s-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="s-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>

    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="shadow-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="4" filter="url(#shadow-drop)"/>
  <circle cx="256" cy="256" r="200" fill="url(#core-glow)"/>

  <g opacity="0.15" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
    <line x1="96" y1="256" x2="144" y2="256"/>
    <line x1="368" y1="256" x2="416" y2="256"/>
    <line x1="256" y1="96" x2="256" y2="144"/>
    <line x1="256" y1="368" x2="256" y2="416"/>
    <circle cx="144" cy="256" r="3" fill="#ffffff"/>
    <circle cx="368" cy="256" r="3" fill="#ffffff"/>
    <circle cx="256" cy="144" r="3" fill="#ffffff"/>
    <circle cx="256" cy="368" r="3" fill="#ffffff"/>
  </g>

  <path d="M 330 148 C 300 148, 230 148, 206 172 C 180 198, 180 236, 214 258 L 298 300 C 334 318, 334 354, 306 376 C 280 396, 210 396, 178 396"
        fill="none" 
        stroke="url(#s-grad-2)" 
        stroke-width="42" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.95"/>

  <path d="M 330 148 C 300 148, 230 148, 206 172 C 180 198, 180 236, 214 258 L 298 300 C 334 318, 334 354, 306 376 C 280 396, 210 396, 178 396"
        fill="none" 
        stroke="url(#s-grad-1)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <g transform="translate(348, 134)">
    <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="url(#spark-grad)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <circle cx="348" cy="376" r="8" fill="#10b981" filter="drop-shadow(0 0 8px #10b981)"/>
</svg>
