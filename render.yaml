# Render Blueprint — Smith AI Python FastAPI Backend Service
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: smith-ai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: "10000"
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_WHISPER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_AUTH_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: smith_ai
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
